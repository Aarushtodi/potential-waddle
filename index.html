<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--outer);font-family:var(--sans);color:var(--ink);display:flex;justify-content:center;align-items:center;overscroll-behavior:none}
#app{container-type:size;position:relative;width:100%;height:100dvh;background:var(--paper);overflow:hidden;font-weight:500}
@media(min-width:500px){#app{width:390px;height:min(844px,calc(100dvh - 32px));border-radius:44px;box-shadow:0 18px 60px rgba(0,0,0,.28)}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.nav{background:var(--bar);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;display:flex;align-items:center;gap:8px;min-height:58px;flex:none}
.nav .ttl{font-weight:800;font-size:30px;flex:1;min-width:0}
.nav.sub .ttl{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:0;background:var(--card);color:var(--ink);font:600 14.5px var(--sans);padding:8px 13px;border-radius:99px;cursor:pointer;white-space:nowrap}
.pill.round{width:36px;height:36px;padding:0;display:grid;place-items:center;font-size:21px;line-height:1}
.pill svg{display:block}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 16px calc(env(safe-area-inset-bottom) + 128px);-webkit-overflow-scrolling:touch;position:relative}

.card+.card{margin-top:10px}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:50px;border-top:1px solid var(--rule);width:100%;text-align:left;color:inherit;font:inherit;background:none;border-left:0;border-right:0;border-bottom:0}

.tiny{font-size:11px;color:var(--sec);font-weight:500;text-align:right;white-space:nowrap}

.mark b.on{background:var(--done);border-color:var(--done);position:relative}
.mark b.on:after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid var(--paper);border-width:0 2.6px 2.6px 0;transform:rotate(42deg)}
.prog{display:flex;align-items:center;gap:10px;padding:13px 16px}
.bars{flex:1;display:flex;gap:5px;height:12px}

.bars span.f{background:var(--ink)}
.prog em{font:700 14px var(--sans);white-space:nowrap}
.foot{font-size:12.5px;color:var(--sec);line-height:1.35;padding:7px 16px 0}
.strip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sec);margin:0 0 14px;min-height:30px}
.strip .pill{font-size:12.5px;padding:5px 11px}
.strip .pill[disabled]{color:var(--sec);cursor:default}
.spin{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--empty);border-top-color:var(--ink);animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

.now+.prog{border-top:1px solid var(--rule)}
.now{display:flex;gap:10px;align-items:center;padding:12px 16px}
.tabs{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 14px);background:var(--card);border:1px solid var(--rule);border-radius:30px;display:flex;padding:5px;z-index:5;box-shadow:0 6px 22px rgba(0,0,0,.16)}
.tab{flex:1;border:0;background:none;color:var(--sec);font:600 10.5px var(--sans);padding:6px 0 5px;border-radius:24px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab.on{color:var(--ink);background:var(--paper)}
.seg{display:flex;background:var(--empty);border-radius:12px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:600 13px var(--sans);padding:7px 4px;border-radius:10px;cursor:pointer;white-space:nowrap}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}

.chip{flex:none;border:1px solid var(--rule);background:none;color:var(--ink);font:600 13px var(--sans);padding:6px 11px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
input.f{font:700 16px var(--sans);color:var(--ink);background:var(--paper);border:0;border-radius:10px;padding:8px 10px;width:76px;text-align:right;font-variant-numeric:tabular-nums;outline:0}
input.f:focus{box-shadow:0 0 0 2px var(--ink)}
input.w{width:100%;text-align:left}
input.plain{background:none;padding:0;border-radius:0;text-align:left;width:100%;font:700 16.5px var(--sans)}
input.plain:focus{box-shadow:none;border-bottom:1px solid var(--ink)}
input[type=date].f{width:auto;text-align:left;font-size:15px}
.tog{width:50px;height:30px;border-radius:99px;background:var(--empty);position:relative;flex:none;border:0;cursor:pointer}
.tog:after{content:"";position:absolute;left:2px;top:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.tog.on{background:var(--ink)}.tog.on:after{left:22px}

.big-res{font-weight:800;font-size:34px;line-height:1.1}

.pad{padding:13px 16px}
.dual{display:flex;gap:10px}.dual>div{flex:1}
.btn{display:block;width:100%;border:0;font:700 17px var(--sans);padding:14px;border-radius:22px;background:var(--ink);color:var(--paper);cursor:pointer;text-align:center}

.toolrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}

.dim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:10;display:flex;align-items:flex-end}
.sheet{background:var(--paper);width:100%;max-height:92%;border-radius:26px 26px 0 0;display:flex;flex-direction:column}.sheet.anim{animation:up .22s ease-out}

.sheet .bar{display:flex;align-items:center;padding:13px 14px;gap:8px}
.sheet .bar .ttl{flex:1;text-align:center;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .body{overflow-y:auto;padding:0 16px calc(env(safe-area-inset-bottom) + 28px)}
.banner{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 8px);background:var(--ink);color:var(--paper);border-radius:22px;padding:12px 15px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.35);cursor:pointer}.banner.anim{animation:dn .3s ease-out}

.banner .t{font-size:14.5px}.banner .s{color:inherit;opacity:.82}
.cal{padding:12px 8px 10px}
.calh{display:flex;align-items:center;padding:0 8px 8px;font-weight:700;font-size:16.5px}
.calh button{border:0;background:none;color:var(--ink);font-size:21px;padding:2px 10px;cursor:pointer}
.calg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.calg .w{font-size:11.5px;font-weight:600;color:var(--sec);padding-bottom:6px}
.dy{height:45px;border:0;background:none;color:var(--ink);font:500 17px var(--sans);display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:3px 0 0;position:relative}

.dy.tod span{font-weight:800}
.dy.sel span{background:var(--ink);color:var(--paper);font-weight:700}
.dy u{width:5px;height:5px;border-radius:50%;background:var(--sec);margin-top:1px;display:block}
.dy u.u{background:var(--urgent)}
.wgrid{display:flex;gap:12px;justify-content:center;padding:6px 0 12px}
.wg{background:var(--paper);border-radius:22px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.wg.small{width:148px;height:148px}.wg.medium{width:100%;height:148px}
.wg .k{font-size:11px;font-weight:600;color:var(--sec)}
.wg .v{font-weight:800;font-size:21px;line-height:1.12}.wg .v i{font-family:var(--serif);font-style:italic;font-weight:700}
.wg .h{font-weight:800;font-size:40px;line-height:1}
.lock{background:#10100b;color:#f0f0e4;border-radius:22px;padding:16px 14px 18px;text-align:center}
.lock .clock{font-weight:700;font-size:52px;line-height:1}
.lock .d{font-size:13.5px;opacity:.8;margin-bottom:6px}
.lw{display:flex;gap:7px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.lw>div{background:rgba(240,240,228,.14);border-radius:14px;padding:7px 10px;font-size:12px;text-align:left;line-height:1.2}
.lw .c{width:58px;height:58px;border-radius:50%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.lw .c b{font-size:20px;line-height:1}.lw .c small{font-size:9.5px}
.lw .r{flex:1 1 100%;font-weight:600}.lw .r small{display:block;opacity:.72;font-weight:500}
.lk{position:absolute;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer}
.lk svg{animation:pu 1s ease-in-out infinite alternate}
@keyframes pu{to{transform:scale(1.07)}}
/* bell */
.dial{display:block;margin:0 auto;width:100%;max-width:330px;height:auto}
.dial text{font-family:var(--sans);fill:var(--ink)}
.tapew{position:relative;background:var(--card);border-radius:22px;overflow:hidden;height:max(240px,calc(100cqh - 280px - env(safe-area-inset-top) - env(safe-area-inset-bottom)))}
#tape{position:relative;height:100%;overflow-y:auto;scrollbar-width:none;padding:8px 14px 12px 56px}
#tape::-webkit-scrollbar{display:none}
.nowl{position:absolute;left:-50px;right:-8px;height:0;border-top:2px solid var(--ink);z-index:2;pointer-events:none}
.nowl span{position:absolute;left:0;top:-11px;background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
.tb{position:relative;margin:0 -4px;border-radius:14px;overflow:hidden;background:var(--paper);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-start;cursor:pointer}
.tb .fill{position:absolute;left:0;right:0;top:0;background:var(--ink);opacity:.12}
.tb .t,.tb .s{position:relative}
.tg{display:flex;align-items:center;justify-content:flex-start;font-size:10.5px;color:var(--sec)}
.tick{position:absolute;left:-46px;font-size:10.5px;color:var(--sec);font-variant-numeric:tabular-nums}
.tw{position:relative}
.bign{font-weight:800;font-size:128px;line-height:.92;letter-spacing:-5px;font-variant-numeric:tabular-nums}
.bigm{font-family:var(--serif);font-style:italic;font-weight:700;font-size:28px}
.dayb{display:flex;gap:3px;height:42px;margin:14px 0 4px}
.dayb button{border:0;padding:0;border-radius:7px;background:var(--empty);position:relative;overflow:hidden;cursor:pointer}
.dayb button i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.dayb button.sel{outline:2px solid var(--ink);outline-offset:1px}
.letter{position:absolute;right:16px;top:12px;width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:20px}
</style>

{id:'chem',name:'Chemistry Honors',teacher:'Dr. Placeholder',room:'Room 118',level:'H',abs:0,tardy:1,q1:89,rows:[R('Atoms Test','Test',-40,91,100),R('Flame Lab','Lab',-25,46,50),R('Bonding Test','Test',-18,84,100),R('Worksheet 9','HW',-6,null,10,{mark:'ABS'}),R('Reactions Test','Test',-1,null,100,{pending:1}),R('Titration Lab','Lab',0,null,50)]},

{id:'span',name:'Spanish II',teacher:'Sra. Muestra',room:'Room 122',level:'R',abs:2,tardy:0,q1:88,rows:[R('Unidad 3 Test','Test',-22,86,100),R('Speaking Check','Test',-8,90,100),R('Workbook 4','HW',-4,18,20),R('Workbook 5','HW',-1,null,20,{pending:1}),R('Vocabulario 7','HW',0,null,10)]},

 pace:[{title:'Pick topic',off:2},{title:'Research',off:5},{title:'First draft',off:8},{title:'Final',off:10}],

let lastKey='';
function render(){const m=$('#main');if(m&&lastKey)S.scroll[lastKey]=m.scrollTop;const sb=$('.sheet .body');const st=sb?sb.scrollTop:0,same=sheetKey()===lastSheet;$('#app').innerHTML=view();lastSheet=sheetKey();lastAnim=animKey();const nb=$('.sheet .body');if(nb&&same)nb.scrollTop=st;lastKey=routeKey();const n=$('#main');if(n)n.scrollTop=S.scroll[lastKey]||0;const t=$('#tape');if(t){const cu=t.querySelector('.cur');t.scrollTop=S.tapeTop??(cu?cu.offsetTop-8:0)}}
function live(){const nodes=$$('[data-live]');if(!nodes.length)return;const tmp=document.createElement('div');tmp.innerHTML=view();const fresh=tmp.querySelectorAll('[data-live]');if(fresh.length!==nodes.length){render();return}nodes.forEach((n,i)=>{if(n.innerHTML!==fresh[i].innerHTML)n.innerHTML=fresh[i].innerHTML})}
// RELOAD
function startLoad(apply){if(S.loading)return;S.loading=true;render();setTimeout(()=>{S.loading=false;S.updated=Date.now();if(apply){S.wait=Date.now()+6e4;applyNext()}render()},1300)}
function applyNext(){const q=[['chem','Reactions Test',78],['span','Workbook 5',16]][S.qi];if(!q)return;S.qi++;const c=cls(q[0]),r=c.rows.find(x=>x.title===q[1]),before=avgOf(c.rows);r.score=q[2];delete r.pending;const after=avgOf(c.rows);const l={cid:c.id,title:r.title,cat:r.cat,line:scoreLine(r),low:under(r),before,after,ago:'Just now'};S.log.unshift(l);if(!S.mute[c.id])showBanner(c.name,alertBody(l))}
let bT;function showBanner(t,b){S.banner={t,b,fresh:true};setTimeout(()=>{if(S.banner)S.banner.fresh=false},400);clearTimeout(bT);bT=setTimeout(()=>{S.banner=null;render()},6000)}
// ACTIONS
const A={
 chooseD(){S.sheet={k:'district'}},pickD(n){S.dist=n||null;S.notList=!n;S.sheet=null},
 enter(){S.scr='app';S.tab='home';startLoad(false);return false},
 closeSheet(){S.sheet=null;S.form={}},dimClose(x,y,el,ev){if(ev.target===el){S.sheet=null;S.form={}}else return false},
 tab(t){if(S.tab===t)S.stacks[t]=[];S.tab=t;S.edit=false},
 push(x,y){S.edit=false;S.stacks[S.tab].push(y!=null?[x,y]:[x])},back(){S.stacks[S.tab].pop()},
 sheet(k){S.form={};S.sheet={k}},task(id){S.sheet={k:'task',id}},
 tick(id){if(S.done[id])delete S.done[id];else S.done[id]=1},
 reload(){startLoad(true);return false},
 goBell(){S.tab='bell';S.stacks.bell=[]},
 edit(){S.edit=!S.edit},period(){S.sheet={k:'period'}},setP(k){S.period=k;S.sheet=null},
 mv(id,d){const o=S.order,i=o.indexOf(id),j=i+ +d;if(j>=0&&j<o.length){[o[i],o[j]]=[o[j],o[i]]}},hide(id){S.hide[id]=!S.hide[id]},delClass(id){S.typed=S.typed.filter(c=>c.id!==id);S.order=S.order.filter(x=>x!==id)},
 signout(){S.scr='in';S.dist=null;S.notList=false;S.edit=false;S.tab='home';Object.keys(S.stacks).forEach(k=>S.stacks[k]=[]);S.updated=null},
 mail(cid,rid){S.sheet={k:'mail',cid,rid}},
 gpt(cid,i){S.gsel[cid]=+i},
 wiReset(cid){delete S.wi[cid]},wiOpen(cid){S.sheet={k:'wi',cid,tool:null}},wiT(k){S.sheet.tool=k||null;if(k==='need')S.need.cid=S.sheet.cid},openGoal(){S.sheet=null;S.stacks[S.tab].push(['gpagoal'])},
 fkAdd(cid){const w=wi(cid),f=w.fk;if(!f.name.trim()||!(+f.pts>0)||f.score==='')return false;w.fake.push({id:'f'+S.nextT++,name:f.name.trim(),cat:f.cat,pts:f.pts,score:f.score});w.fk={name:'',cat:f.cat,pts:f.pts,score:''}},fkDel(cid,id){const w=wi(cid);w.fake=w.fake.filter(f=>f.id!==id)},lineP(v){if(v==='own')S.lineOwn=true;else{S.lineOwn=false;S.line=+v}},wiDropT(cid){const w=wi(cid);w.drop=!w.drop},
 scenSave(cid){const c=cls(cid),l=S.scen[cid]||(S.scen[cid]=[]);const st=JSON.parse(JSON.stringify(wi(cid)));l.push({name:'Scenario '+(l.length+1),st,avg:wiAvg(c,st)});S.sheet.tool='scen'},scenDel(cid,i){S.scen[cid].splice(+i,1)},
gwReset(){S.gw={}},
 needC(id){S.need.cid=id},needK(k){S.need.kind=k},wiFill(cid,v){const c=cls(cid),w=wi(cid);for(const r of blankLeft(c)){let p=+v;if(v==='usual'){const q=c.rows.filter(x=>x.cat===r.cat&&scored(x));p=q.length?q.reduce((a,x)=>a+x.score,0)/q.reduce((a,x)=>a+x.total,0)*100:avgOf(c.rows)}w.scores[r.id]=String(Math.round(p/100*r.total*10)/10)}},
 sampleAlert(){const l=S.log[0];showBanner(cls(l.cid).name,alertBody(l))},bannerTap(){S.banner=null;S.tab='grades';S.stacks.grades=[['changes']]},
 paceM(i,d){const p=S.pace[+i],due=dueOf(rowBy('hist3').r),n=p.off+ +d;if(n>=0&&n<=due)p.off=n;},
 openPace(){S.sheet=null;S.stacks[S.tab].push(['pace'])},openAsg(id){S.sheet=null;S.stacks[S.tab].push(['asg',id])},
 resetDue(id){delete S.over[id]},delTodo(id){S.todos=S.todos.filter(t=>t.id!==id);S.sheet=null},
 formDate(){S.form.hasDate=!S.form.hasDate},saveTodo(){const f=S.form,t=(f.title||'').trim();if(!t)return false;S.todos.push({id:'t'+S.nextT++,title:t,off:f.hasDate?fromIso(f.due||iso(1)):null});S.sheet=null;S.form={}},
 saveClass(){const f=S.form,n=(f.cname||'').trim(),g=parseFloat(f.cgrade);if(!n||isNaN(g)||S.typed.length>=TYPED_CAP)return false;const lvl=f.clvl||'DC',id='x'+S.nextT++;S.typed.push({id,typed:true,name:n,grade:g,level:lvl,levelName:{DC:'dual credit',AP:'self study AP',R:'regular'}[lvl],teacher:'',abs:0,tardy:0,rows:[]});S.order.push(id);S.sheet=null;S.form={}},
 clvl(v){S.form.clvl=v},
 day(o){S.sel=+o},calM(d){S.calM=(S.calM??0)+ +d},
 look(v){S.look=v;S.bellSel=null;S.tapeTop=null},bday(v){S.bellDay=v;S.bellSel=null;S.tapeTop=null},bsel(i){S.bellSel=+i},
 mute(id){S.mute[id]=!S.mute[id]},faceid(){S.faceid=!S.faceid;if(S.faceid)A.lock()},
 lock(){S.lock=true;setTimeout(A.unlock,1300)},unlock(){if(!S.lock)return false;S.lock=false;S.tab='home';S.stacks.home=[];S.scroll={};lastKey='';S.updated=null;startLoad(false);return false},
 wgC(k,c){S.wg[k].cid=c},
};
document.addEventListener('click',ev=>{if(lpFired){lpFired=false;return}const el=ev.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,x=el.dataset.x,y=el.dataset.y;let out;
 if(a.includes(':')){const[k,id]=a.split(':');if(k==='gw')S.gw[id]=x;else if(k==='pick'){if(x==='off')delete S.picks[id];else S.picks[id]=x}else if(k==='wgS')S.wg[id].size=x;else if(k==='fkC')wi(id).fk.cat=x}
 else if(A[a])out=A[a](x,y,el,ev);
 if(out!==false)render()});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}});
const I={rename(v,x){cls(x).name=v},goal(v,x){if(v==='')delete S.goals[x];else S.goals[x]=+v},
 wi(v,x,y){wi(x).scores[y]=v},wiX(v,x){wi(x).extra=v},wiC(v,x,y){wi(x).corr[y]=v},fin(v,x){S.fin[x]=v},needT(v){S.need.target=v},
 fk(v,x,y){wi(x).fk[y]=v},wiCu(v,x,y){wi(x).curve[y]=v},sem(v,x,y){S.sem[x][y]=v},scenN(v,x,y){S.scen[x][+y].name=v},ggoal(v){S.ggoal=v},under(v){S.under=+v||0},line(v){S.line=+v||0},paceN(v,x){S.pace[+x].title=v},form(v,x){S.form[x]=v}};
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.i&&I[d.i]){I[d.i](e.target.value,d.x,d.y);live()}});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.c==='due'&&e.target.value){const n=fromIso(e.target.value),id=d.x;const t=S.todos.find(q=>q.id===id);if(t)t.off=n;else if(/^cp/.test(id))S.pace[+id.slice(2)].off=n;else if(rowBy(id))S.over[id]=n;render()}});
document.addEventListener('scroll',e=>{if(e.target&&e.target.id==='tape')S.tapeTop=e.target.scrollTop},true);
// long press + pull
let lpT,lpFired=false,pullY=null,pullD=0;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-lp]');if(el)lpT=setTimeout(()=>{lpFired=true;S.edit=true;render();setTimeout(()=>lpFired=false,700)},520)});
['pointerup','pointercancel','pointermove'].forEach(n=>document.addEventListener(n,e=>{if(n!=='pointermove'||Math.abs(e.movementY)>3)clearTimeout(lpT)}));
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-lp]'))e.preventDefault()});
document.addEventListener('touchstart',e=>{const m=$('#main');pullY=(m&&m.contains(e.target)&&m.scrollTop<=0&&!S.stacks[S.tab].length&&S.tab!=='bell'&&!e.target.closest('#tape'))?e.touches[0].clientY:null;pullD=0},{passive:true});
document.addEventListener('touchmove',e=>{if(pullY==null)return;pullD=e.touches[0].clientY-pullY},{passive:true});
document.addEventListener('touchend',()=>{if(pullY!=null&&pullD>80){if(Date.now()>=S.wait)startLoad(true)}pullY=null},{passive:true});
setInterval(()=>{if(S.scr==='app'&&!S.lock&&!S.loading){if(S.wait&&Date.now()>=S.wait&&$('.strip .pill[disabled]')){S.wait=0}live()}},1000);
render();
</script>
